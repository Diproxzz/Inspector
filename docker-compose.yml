version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: inspector_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: inspector_qc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: inspector_web
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/inspector_qc
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
